[project]
name = "agent-plugin-synapse"
version = "1.7.1"
description = "Real-time security guardrails and PreToolUse interceptors for coding agents powered by Laya System 1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "laya>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Temporales y caché dentro de ./tmp del proyecto
addopts = "--basetemp=tmp/pytest -p no:cacheprovider -m 'not e2e_hosts'"
markers = ["e2e_hosts: E2E con los binarios reales de Codex, Antigravity y OpenCode (costo de modelo); -m e2e_hosts"]
